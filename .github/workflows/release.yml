name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: netscan-linux-x86_64-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: netscan-linux-aarch64-static
          - target: x86_64-apple-darwin
            os: macos-latest
            name: netscan-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: netscan-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"linux-musl" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/netscan ${{ matrix.name }}
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tar.gz'

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
